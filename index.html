<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Windows, macOS ও Linux শর্টকাট গাইড</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --bg:#18181b;
    --bg-elev:#202023;
    --bg-card:#26262a;
    --bg-card-hover:#2f2f34;
    --border:#37373c;
    --text:#e2e2e5;
    --text-dim:#95959c;
    --text-bright:#ffffff;
    --accent:#3b82f6;
    --accent-bright:#7dd3fc;
    --accent-grad-2:#a78bfa;
    --keycap-bg:#323236;
    --keycap-bg-hover:#3b3b40;
    --keycap-border:#59595f;
    --badge-variant:#a78bfa;
    --success:#6ccb5f;
    --danger:#f87171;
    --star:#f5a623;
    --radius:8px;
    --sidebar-w:256px;
    --titlebar-h:48px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{ -webkit-text-size-adjust:100%; }
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Noto Sans Bengali','Segoe UI',system-ui,sans-serif;
    overflow-x:hidden;
    width:100%;
  }
  img,svg{ max-width:100%; display:block; }
  button{ font-family:inherit; }
  ::selection{ background:rgba(59,130,246,.35); }

  /* ---------- Title bar ---------- */
  .titlebar{
    height:var(--titlebar-h);
    background:#212124;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 8px 0 6px;
    gap:8px;
    position:sticky;
    top:0;
    z-index:100;
  }
  .menu-btn{
    display:none;
    align-items:center;
    justify-content:center;
    width:40px; height:40px;
    background:transparent;
    border:none;
    border-radius:6px;
    color:var(--text);
    cursor:pointer;
    flex:none;
  }
  .menu-btn:hover, .menu-btn:focus-visible{ background:#3a3a3a; }
  .titlebar-label{
    flex:1;
    text-align:center;
    font-size:12.5px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',Consolas,monospace;
    letter-spacing:.2px;
    padding:0 6px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .lang-switch{
    display:flex;
    align-items:center;
    background:#2c2c30;
    border:1px solid #4a4a50;
    border-radius:999px;
    padding:2px;
    flex:none;
    gap:2px;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:11.5px;
    font-weight:600;
    padding:6px 10px;
    border-radius:999px;
    cursor:pointer;
    min-height:28px;
    transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .lang-btn.active{
    background:linear-gradient(135deg,var(--accent-bright),var(--accent-grad-2));
    color:#0d1117;
  }
  .lang-btn:not(.active):hover{ color:var(--text); }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding:clamp(26px,6vw,46px) 16px clamp(20px,5vw,26px);
    text-align:center;
    border-bottom:1px solid var(--border);
    overflow:hidden;
    background:var(--bg-elev);
  }
  .hero::before{
    content:'';
    position:absolute;
    inset:-40% -10% auto -10%;
    height:340px;
    background:
      radial-gradient(420px 220px at 25% 0%, rgba(59,130,246,.25), transparent 65%),
      radial-gradient(420px 220px at 80% 10%, rgba(167,139,250,.2), transparent 65%);
    filter:blur(10px);
    pointer-events:none;
  }
  .hero-inner{ position:relative; }
  .hero-eyebrow{
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:clamp(11px,2vw,12.5px);
    color:var(--accent-bright);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .hero h1{
    font-weight:700;
    font-size:clamp(22px,5.6vw,38px);
    color:var(--text-bright);
    letter-spacing:-.3px;
    line-height:1.25;
  }
  .hero h1 span{
    background:linear-gradient(90deg,var(--accent-bright),var(--accent-grad-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero p{
    margin-top:8px;
    font-size:clamp(13px,2.6vw,15.5px);
    color:var(--text-dim);
    padding:0 8px;
  }

  /* ---------- OS tabs ---------- */
  .os-tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:22px auto 0;
    max-width:640px;
    padding:0 12px;
    flex-wrap:wrap;
  }
  .os-tab{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    background:#2a2a2e;
    border:1px solid #444;
    color:var(--text-dim);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
    min-height:40px;
  }
  .os-tab svg{ width:16px; height:16px; flex:none; }
  .os-tab:hover{ background:#333338; color:var(--text); }
  .os-tab.active{
    background:linear-gradient(135deg, rgba(59,130,246,.24), rgba(167,139,250,.24));
    border-color:var(--accent-bright);
    color:var(--text-bright);
  }

  /* ---------- Sub switcher (win version / linux distro) ---------- */
  .sub-tabs{
    display:none;
    justify-content:center;
    gap:7px;
    margin:12px auto 0;
    max-width:680px;
    padding:0 12px;
    flex-wrap:wrap;
  }
  .sub-tabs.show{ display:flex; }
  .sub-tab{
    padding:7px 13px;
    border-radius:999px;
    background:transparent;
    border:1px solid #444;
    color:var(--text-dim);
    font-size:12.5px;
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
    min-height:34px;
    font-family:'JetBrains Mono',Consolas,monospace;
  }
  .sub-tab:hover{ background:#2f2f34; color:var(--text); }
  .sub-tab.active{
    background:var(--accent-bright);
    border-color:var(--accent-bright);
    color:#0d1117;
  }

  /* ---------- Search pill ---------- */
  .palette-wrap{
    max-width:600px;
    margin:20px auto 0;
    padding:0 12px;
  }
  .palette{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(50,50,54,.65);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid #4a4a50;
    border-radius:999px;
    padding:12px 18px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:border-color .15s, box-shadow .15s;
  }
  .palette:focus-within{
    border-color:var(--accent-bright);
    box-shadow:0 0 0 3px rgba(125,211,252,.18), 0 10px 30px rgba(0,0,0,.4);
  }
  .palette svg{ flex:none; opacity:.75; width:17px; height:17px; }
  .palette input{
    flex:1;
    min-width:0;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text-bright);
    font-size:15px;
    font-family:'Noto Sans Bengali','Segoe UI',sans-serif;
  }
  .palette input::placeholder{ color:var(--text-dim); }
  .palette-kbd{
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:11px;
    color:var(--text-dim);
    border:1px solid #5a5a5a;
    border-radius:6px;
    padding:2px 6px;
    flex:none;
    display:none;
  }
  @media (min-width:480px){ .palette-kbd{ display:inline-block; } }

  .kbd-caption{
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:9px;
    padding:0 12px;
    line-height:1.5;
  }

  .legend{
    display:flex;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
    margin-top:10px;
    font-size:11.5px;
    color:var(--text-dim);
    padding:0 12px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }

  .detected-pill{
    position:fixed;
    left:50%;
    bottom:44px;
    transform:translate(-50%,12px);
    background:#26262a;
    border:1px solid var(--keycap-border);
    color:var(--text-bright);
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:13px;
    padding:9px 16px;
    border-radius:999px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s, transform .18s;
    z-index:200;
    white-space:nowrap;
    max-width:90vw;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .detected-pill.show{ opacity:1; transform:translate(-50%,0); }
  .detected-pill.ok{ border-color:var(--success); color:var(--success); }
  .detected-pill.no{ border-color:var(--danger); color:var(--danger); }

  /* ---------- Layout ---------- */
  .layout{
    display:flex;
    max-width:1180px;
    margin:0 auto;
    align-items:flex-start;
    position:relative;
  }

  .backdrop{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    z-index:90;
  }
  .backdrop.show{ display:block; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    flex:none;
    position:sticky;
    top:var(--titlebar-h);
    align-self:flex-start;
    max-height:calc(100vh - var(--titlebar-h));
    overflow-y:auto;
    padding:20px 10px 40px 16px;
    -webkit-overflow-scrolling:touch;
  }
  .sidebar-title{
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:10px;
    padding-left:8px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px 10px;
    border-radius:6px;
    color:var(--text);
    font-size:14px;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .12s;
    min-height:40px;
  }
  .nav-item:hover{ background:var(--bg-card-hover); }
  .nav-item.active{
    background:rgba(59,130,246,.16);
    border-left-color:var(--accent-bright);
    color:var(--text-bright);
  }
  .nav-item .count{
    margin-left:auto;
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:11.5px;
    color:var(--text-dim);
    background:#3a3a3f;
    padding:1px 7px;
    border-radius:10px;
  }
  .nav-icon{ flex:none; opacity:.85; width:16px; height:16px; }

  /* ---------- Main content ---------- */
  main{
    flex:1;
    min-width:0;
    padding:24px 20px 96px;
  }

  .no-results{
    display:none;
    text-align:center;
    padding:60px 16px;
    color:var(--text-dim);
  }
  .no-results.show{ display:block; }
  .no-results .big{ font-size:34px; margin-bottom:10px; }

  section.category{
    margin-bottom:36px;
    scroll-margin-top:60px;
  }
  section.category.hidden{ display:none; }

  .cat-header{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .cat-num{
    font-family:'JetBrains Mono',Consolas,monospace;
    color:var(--accent-bright);
    font-size:14px;
    font-weight:700;
  }
  .cat-title{
    font-size:clamp(16.5px,3.2vw,19px);
    font-weight:600;
    color:var(--text-bright);
  }
  .cat-sub{
    font-size:13px;
    color:var(--text-dim);
    margin:8px 0 16px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(min(100%,300px),1fr));
    gap:10px;
  }

  .card{
    --mx:50%; --my:50%;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:13px 14px;
    transition:background .12s, border-color .12s, box-shadow .25s;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    min-height:44px;
  }
  .card::after{
    content:'';
    position:absolute;
    inset:0;
    background:radial-gradient(160px circle at var(--mx) var(--my), rgba(125,211,252,.12), transparent 60%);
    opacity:0;
    transition:opacity .2s;
    pointer-events:none;
  }
  .card:hover::after, .card:focus-visible::after{ opacity:1; }
  .card:hover, .card:focus-visible{
    background:var(--bg-card-hover);
    border-color:#5a5a5a;
    outline:none;
  }
  .card:focus-visible{ box-shadow:0 0 0 2px var(--accent-bright); }
  .card.hidden{ display:none; }
  .badge-star{
    position:absolute; top:6px; right:8px;
    font-size:10px; color:var(--star); opacity:.9;
  }
  .badge-variant{
    position:absolute; top:6px; right:8px;
    font-size:9px;
    font-family:'JetBrains Mono',Consolas,monospace;
    font-weight:700;
    padding:1px 6px;
    border-radius:8px;
    color:#fff;
    background:var(--badge-variant);
    white-space:nowrap;
    max-width:110px;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .keys{
    display:flex;
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
    flex:none;
    min-width:120px;
    max-width:44%;
  }
  .chord{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .chord + .chord::before{
    content:'';
    display:inline-block;
    width:10px;
  }
  kbd{
    font-family:'JetBrains Mono',Consolas,monospace;
    font-size:12px;
    font-weight:600;
    color:var(--text-bright);
    background:var(--keycap-bg);
    border:1px solid var(--keycap-border);
    border-bottom-width:2px;
    border-radius:5px;
    padding:4px 7px;
    white-space:nowrap;
  }
  .card:hover kbd{ background:var(--keycap-bg-hover); }
  .plus{ color:var(--text-dim); font-size:11px; }

  .desc{
    font-size:13.5px;
    color:var(--text);
    line-height:1.5;
    flex:1;
    min-width:0;
  }
  mark{
    background:rgba(125,211,252,.28);
    color:var(--text-bright);
    border-radius:2px;
    padding:0 1px;
  }

  .copy-hint{
    margin-left:auto;
    font-size:10.5px;
    color:var(--text-dim);
    opacity:0;
    transition:opacity .12s;
    flex:none;
    font-family:'JetBrains Mono',Consolas,monospace;
    display:none;
  }
  @media (hover:hover){
    .copy-hint{ display:block; }
    .card:hover .copy-hint{ opacity:.7; }
  }
  .card.copied .copy-hint{ opacity:1 !important; color:var(--success); display:block; }

  .os-lock{
    flex:none;
    font-size:12px;
    opacity:.55;
    cursor:help;
    line-height:1;
  }
  .card.copied .os-lock{ opacity:.3; }

  /* ---------- Keyboard-match highlight ---------- */
  @keyframes kbdPulse{
    0%   { box-shadow:0 0 0 0 rgba(125,211,252,.65), 0 0 0 0 rgba(125,211,252,.35); border-color:var(--accent-bright); background:rgba(125,211,252,.14); }
    60%  { box-shadow:0 0 0 10px rgba(125,211,252,0), 0 0 0 18px rgba(125,211,252,0); border-color:var(--accent-bright); }
    100% { box-shadow:0 0 0 0 rgba(125,211,252,0); border-color:var(--border); background:var(--bg-card); }
  }
  .card.kbd-match{
    animation:kbdPulse 1.5s ease-out;
  }
  .card.kbd-match kbd{
    background:var(--accent-bright);
    color:#0d1117;
    border-color:var(--accent-bright);
  }

  /* ---------- Status bar ---------- */
  .statusbar{
    position:fixed;
    bottom:0; left:0; right:0;
    min-height:30px;
    background:linear-gradient(90deg,#3b82f6,#7c3aed);
    display:flex;
    align-items:center;
    padding:5px 12px;
    padding-bottom:calc(5px + env(safe-area-inset-bottom));
    font-size:11.5px;
    color:#eef4ff;
    font-family:'JetBrains Mono',Consolas,monospace;
    gap:14px;
    z-index:80;
    box-shadow:0 -2px 10px rgba(0,0,0,.3);
    flex-wrap:wrap;
  }
  .statusbar .item{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .statusbar .sep{ opacity:.4; }
  .statusbar .spacer{ flex:1; }
  .hide-sm{ display:inline-flex; }

  footer.tip{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px 60px 20px;
  }
  .tip-box{
    border:1px dashed var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:13px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .tip-box b{ color:var(--accent-bright); }

  /* ---------- Responsive breakpoints ---------- */
  @media (max-width: 860px){
    .menu-btn{ display:flex; }
    .sidebar{
      position:fixed;
      top:var(--titlebar-h);
      left:0;
      height:calc(100vh - var(--titlebar-h));
      max-height:none;
      width:min(78vw,300px);
      background:var(--bg-elev);
      border-right:1px solid var(--border);
      transform:translateX(-100%);
      transition:transform .22s ease;
      z-index:95;
      padding:16px 12px 24px 16px;
    }
    .sidebar.open{ transform:translateX(0); }
    main{ padding:18px 14px 100px; }
  }

  @media (max-width: 600px){
    .card{ flex-wrap:wrap; }
    .keys{ max-width:100%; min-width:0; }
    .desc{ flex-basis:100%; }
    .hide-sm{ display:none; }
    .statusbar{ font-size:11px; gap:10px; }
    .os-tab span.full{ display:none; }
    .detected-pill{ bottom:40px; font-size:12px; padding:7px 12px; }
    .titlebar-label{ display:none; }
    .lang-btn{ padding:6px 8px; font-size:11px; }
  }

  @media (max-width: 400px){
    .grid{ grid-template-columns:1fr; }
    .hero{ padding-left:12px; padding-right:12px; }
  }

  @media (min-width:1400px){
    .layout{ max-width:1320px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  @media (prefers-contrast: more){
    :root{ --border:#666; --text-dim:#c8c8c8; }
  }
</style>
</head>
<body>

<div class="titlebar">
  <button class="menu-btn" id="menuBtn" aria-label="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="titlebar-label">all-os-shortcuts-reference — Windows · macOS · Linux</div>
  <div class="lang-switch" id="langSwitch">
    <button class="lang-btn" data-lang="bn">বাংলা</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
</div>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow" id="txtEyebrow"></div>
    <h1 id="txtHeroTitle"></h1>
    <p id="txtHeroSub"></p>

    <div class="os-tabs" id="osTabs"></div>
    <div class="sub-tabs" id="subTabs"></div>

    <div class="palette-wrap">
      <div class="palette">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="" autocomplete="off">
        <span class="palette-kbd">Esc</span>
      </div>
    </div>
    <div class="kbd-caption" id="txtKbdCaption"></div>
    <div class="legend">
      <span id="txtLegendLive"></span>
      <span id="txtLegendLock"></span>
    </div>
  </div>
</div>

<div class="layout">
  <div class="backdrop" id="backdrop"></div>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-title" id="txtSidebarTitle"></div>
    <div id="navItems"></div>
  </nav>

  <main>
    <div class="no-results" id="noResults">
      <div class="big">¯\_(ツ)_/¯</div>
      <div id="txtNoResults"></div>
    </div>
    <div id="categories"></div>
  </main>
</div>

<footer class="tip">
  <div class="tip-box" id="tipBox"></div>
</footer>

<div class="statusbar">
  <div class="item">⌨️ <span id="statCount">0 / 0</span> <span id="txtStatShortcuts"></span></div>
  <div class="sep hide-sm">|</div>
  <div class="item hide-sm" id="statOS">Windows · Windows 10</div>
  <div class="spacer"></div>
  <div class="item hide-sm" id="txtStatHint"></div>
</div>

<div class="detected-pill" id="detectedPill"></div>

<script>
/* ============================= UI STRINGS ============================= */

let currentOS = 'windows';
let variantState = { windows:'10', linux:'gnome' };

function getProfile(){ return OS_PROFILES[currentOS]; }
function getVariant(){
  const p = getProfile();
  return p.sub ? variantState[currentOS] : null;
}

/* ============================= HELPERS ============================= */
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(text, q){
  if(!q) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx,idx+q.length)) + '</mark>' + escapeHtml(text.slice(idx+q.length));
}
function keysToPlain(chords){ return chords.map(c => c.join('+')).join(' '); }
function renderKeys(chords){
  return chords.map(chord => {
    const keyEls = chord.map(k => `<kbd>${escapeHtml(k)}</kbd>`).join('<span class="plus">+</span>');
    return `<span class="chord">${keyEls}</span>`;
  }).join('');
}
function toBnDigits(n){
  const map = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
  return String(n).split('').map(ch => map[ch] ?? ch).join('');
}
function fmtCount(n){ return LANG === 'bn' ? toBnDigits(n) : String(n); }
function currentDesc(item){
  const v = getVariant();
  if(v && item.variantDesc && item.variantDesc[v]) return item.variantDesc[v][LANG] || item.variantDesc[v].bn;
  return item.desc[LANG] || item.desc.bn;
}
function itemApplies(item){
  if(!item.onlyVariant) return true;
  return item.onlyVariant === getVariant();
}

/* A shortcut is "OS-level" (globally hooked before the browser ever sees the
   keydown) if it uses the system meta key, is a WM-level switcher, or is a
   well-known reserved combo. Websites can never intercept these — this is a
   heuristic used only to warn the user honestly, not a detection mechanism. */
function looksOSLevel(chord, forOS){
  const set = chord.map(k => k.toLowerCase());
  const has = k => set.includes(k);
  const metaLikes = ['win','cmd','super','meta'];
  if(set.some(k => metaLikes.includes(k))) return true;
  if(has('prtscn')) return true;
  if(has('alt') && has('tab')) return true;
  if(has('ctrl') && has('alt')) return true;
  if(has('alt') && set.some(k => /^f\d{1,2}$/.test(k))) return true;
  if(forOS === 'mac' && has('ctrl') && set.some(k => ['up','down','left','right'].includes(k))) return true;
  const known = [['ctrl','shift','esc'], ['ctrl','alt','delete'], ['ctrl','alt','esc']];
  const target = [...set].sort().join('+');
  if(known.some(k => [...k].sort().join('+') === target)) return true;
  return false;
}

/* ============================= BUILD UI ============================= */
function buildOsTabs(){
  const wrap = document.getElementById('osTabs');
  wrap.innerHTML = Object.keys(OS_PROFILES).map(key => {
    const p = OS_PROFILES[key];
    return `<div class="os-tab ${key===currentOS?'active':''}" data-os="${key}" role="button" tabindex="0">
      <svg viewBox="0 0 24 24">${ICONS[p.icon]}</svg><span class="full">${p.label}</span>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.os-tab').forEach(el => {
    const go = () => switchOS(el.dataset.os);
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  });
}

function buildSubTabs(){
  const wrap = document.getElementById('subTabs');
  const p = getProfile();
  if(!p.sub){ wrap.classList.remove('show'); wrap.innerHTML=''; return; }
  wrap.classList.add('show');
  wrap.innerHTML = p.sub.options.map(o => `
    <div class="sub-tab ${variantState[currentOS]===o.id?'active':''}" data-variant="${o.id}" role="button" tabindex="0">${o.label}</div>
  `).join('');
  wrap.querySelectorAll('.sub-tab').forEach(el => {
    const go = () => {
      variantState[currentOS] = el.dataset.variant;
      buildSubTabs();
      buildNav();
      buildCategories();
      applyFilter();
      updateStatus();
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  });
}

function buildNav(){
  const nav = document.getElementById('navItems');
  const p = getProfile();
  nav.innerHTML = p.categories.map((c,i) => `
    <div class="nav-item" data-cat="${i}" role="button" tabindex="0">
      <svg class="nav-icon" viewBox="0 0 24 24">${ICONS[c.icon]}</svg>
      <span>${c.title[LANG] || c.title.bn}</span>
      <span class="count" id="navcount-${i}"></span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(el => {
    const go = () => {
      const target = document.getElementById('cat-' + el.dataset.cat);
      if(target) target.scrollIntoView({behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      closeSidebar();
    };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  });
}

function buildCategories(){
  const wrap = document.getElementById('categories');
  const p = getProfile();
  const t = UI[LANG];
  wrap.innerHTML = p.categories.map((c,i) => `
    <section class="category" id="cat-${i}" data-cat="${i}">
      <div class="cat-header">
        <span class="cat-num">${String(i+1).padStart(2,'0')}</span>
        <span class="cat-title">${c.title[LANG] || c.title.bn}</span>
      </div>
      <div class="cat-sub">${c.sub[LANG] || c.sub.bn}</div>
      <div class="grid" id="grid-${i}"></div>
    </section>
  `).join('');

  p.items.forEach((item, idx) => { item._idx = idx; });

  p.categories.forEach((c,i) => {
    const grid = document.getElementById('grid-' + i);
    const items = p.items.filter(d => d.cat === i);
    grid.innerHTML = items.map(d => {
      let badge = '';
      if(d.essential) badge = '<span class="badge-star">★</span>';
      else if(d.onlyVariant && p.sub){
        const opt = p.sub.options.find(o => o.id === d.onlyVariant);
        badge = `<span class="badge-variant">${opt ? opt.label.split('·')[0].trim() : d.onlyVariant}</span>`;
      }
      const osLevel = d.chords.length === 1 && looksOSLevel(d.chords[0], currentOS);
      const lockIcon = osLevel ? `<span class="os-lock" title="${escapeHtml(t.osLockTitle)}">🔒</span>` : '';
      return `
      <div class="card" data-idx="${d._idx}" tabindex="0" role="button" title="${escapeHtml(t.copyTitle)}">
        ${badge}
        <div class="keys">${renderKeys(d.chords)}</div>
        <div class="desc"></div>
        ${lockIcon}
        <div class="copy-hint">${escapeHtml(t.copiedText)}</div>
      </div>`;
    }).join('');
  });

  wrap.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => {
      const p2 = getProfile();
      const item = p2.items[card.dataset.idx];
      const text = keysToPlain(item.chords);
      navigator.clipboard?.writeText(text).catch(()=>{});
      card.classList.add('copied');
      setTimeout(() => card.classList.remove('copied'), 900);
    });
    card.addEventListener('keydown', e => { if(e.key === 'Enter') card.click(); });
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
}

function applyFilter(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const p = getProfile();
  let shown = 0, total = 0;

  p.categories.forEach((c,i) => {
    const grid = document.getElementById('grid-' + i);
    if(!grid) return;
    let catShown = 0;
    grid.querySelectorAll('.card').forEach(card => {
      const item = p.items[card.dataset.idx];
      const applies = itemApplies(item);
      if(!applies){ card.classList.add('hidden'); return; }
      total++;
      const desc = currentDesc(item);
      const keyStr = keysToPlain(item.chords).toLowerCase();
      const descStr = desc.toLowerCase();
      const match = !q || keyStr.includes(q) || descStr.includes(q);
      card.classList.toggle('hidden', !match);
      card.querySelector('.desc').innerHTML = highlight(desc, q && descStr.includes(q) ? q : '');
      if(match){ catShown++; shown++; }
    });
    const sec = document.getElementById('cat-' + i);
    if(sec) sec.classList.toggle('hidden', catShown === 0);
    const navcount = document.getElementById('navcount-' + i);
    if(navcount) navcount.textContent = fmtCount(catShown);
    const navItem = document.querySelector(`.nav-item[data-cat="${i}"]`);
    if(navItem) navItem.style.opacity = catShown === 0 ? '0.35' : '1';
  });

  document.getElementById('noResults').classList.toggle('show', shown === 0);
  document.getElementById('statCount').textContent = `${fmtCount(shown)} / ${fmtCount(total)}`;
}

function updateStatus(){
  const p = getProfile();
  const v = getVariant();
  let label = p.label;
  if(v && p.sub){
    const opt = p.sub.options.find(o => o.id === v);
    if(opt) label += ' · ' + opt.label;
  }
  document.getElementById('statOS').textContent = label;
  document.querySelector('.titlebar-label').textContent = p.titlebar;
  const t = UI[LANG];
  document.getElementById('tipBox').innerHTML = `<b>${escapeHtml(t.tipLabel)}:</b> ${escapeHtml(p.tip[LANG] || p.tip.bn)}`;
}

function setupScrollSpy(){
  if(typeof IntersectionObserver === 'undefined') return;
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const active = document.querySelector(`.nav-item[data-cat="${entry.target.dataset.cat}"]`);
        if(active) active.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  document.querySelectorAll('section.category').forEach(s => obs.observe(s));
}

function switchOS(osKey){
  if(osKey === currentOS) return;
  currentOS = osKey;
  buildOsTabs();
  buildSubTabs();
  buildNav();
  buildCategories();
  applyFilter();
  updateStatus();
  setupScrollSpy();
  const firstNav = document.querySelector('.nav-item[data-cat="0"]');
  if(firstNav) firstNav.classList.add('active');
}

function setupSearch(){
  const input = document.getElementById('search');
  input.addEventListener('input', applyFilter);
  document.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      input.focus();
      input.select();
    }
    if(e.key === 'Escape'){
      if(document.activeElement === input){
        input.value = '';
        applyFilter();
        input.blur();
      }
      closeSidebar();
    }
  });
}

function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','true');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
}
function setupMobileNav(){
  const btn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('backdrop');
  btn.addEventListener('click', () => {
    document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
  });
  backdrop.addEventListener('click', closeSidebar);
}

/* ============================= LIVE KEYBOARD-COMBO DETECTION ============================= */
const MOD_KEYS = new Set(['Control','Shift','Alt','Meta','OS','AltGraph']);

function normalizeMainKey(e){
  const k = e.key;
  if(MOD_KEYS.has(k)) return null;
  if(k === ' ') return 'Space';
  if(k === 'ArrowLeft') return 'Left';
  if(k === 'ArrowRight') return 'Right';
  if(k === 'ArrowUp') return 'Up';
  if(k === 'ArrowDown') return 'Down';
  if(k === 'Escape') return 'Esc';
  if(k === 'PrintScreen') return 'PrtScn';
  if(k === '+') return 'Plus';
  if(k === '-' || k === '_') return 'Minus';
  if(k === 'PageUp') return 'Page Up';
  if(k === 'PageDown') return 'Page Down';
  if(k.length === 1) return k.toUpperCase();
  return k;
}

function metaLabel(){
  if(currentOS === 'mac') return 'Cmd';
  if(currentOS === 'windows') return 'Win';
  const v = getVariant();
  return v === 'kde' ? 'Meta' : 'Super';
}

function comboFromEvent(e){
  const mods = [];
  if(e.ctrlKey) mods.push('Ctrl');
  if(e.shiftKey) mods.push('Shift');
  if(e.altKey) mods.push(currentOS === 'mac' ? 'Option' : 'Alt');
  if(e.metaKey) mods.push(metaLabel());
  const main = normalizeMainKey(e);
  return main ? [...mods, main] : mods;
}

function comboKey(arr){ return [...arr].map(s=>s.toLowerCase()).sort().join('+'); }

function findMatchingItem(combo){
  if(combo.length === 0) return null;
  const p = getProfile();
  const target = comboKey(combo);
  return p.items.find(item => itemApplies(item) && item.chords.length === 1 && comboKey(item.chords[0]) === target);
}

let pillTimer = null;
function flashDetected(text, matched){
  const t = UI[LANG];
  const el = document.getElementById('detectedPill');
  el.textContent = (matched ? t.matchedPrefix : t.noMatchPrefix) + text;
  el.classList.remove('show','ok','no');
  void el.offsetWidth;
  el.classList.add('show', matched ? 'ok' : 'no');
  clearTimeout(pillTimer);
  pillTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

function highlightCard(item){
  const card = document.querySelector(`.card[data-idx="${item._idx}"]`);
  if(!card) return;
  const reduced = (typeof window.matchMedia === 'function') && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  card.scrollIntoView({behavior: reduced ? 'auto' : 'smooth', block:'center'});
  card.classList.remove('kbd-match');
  void card.offsetWidth;
  card.classList.add('kbd-match');
  setTimeout(() => card.classList.remove('kbd-match'), 1500);
}

function setupKeyCapture(){
  document.addEventListener('keydown', (e) => {
    const activeTag = document.activeElement && document.activeElement.tagName;
    if(activeTag === 'INPUT' || activeTag === 'TEXTAREA') return;
    if(e.repeat) return;

    const combo = comboFromEvent(e);
    if(combo.length === 0) return;

    const item = findMatchingItem(combo);
    const label = combo.join('+');

    if(item){
      const mainKey = combo[combo.length - 1];
      const isSafeEditOp = !e.metaKey && ['C','V','X','Z','A'].includes(mainKey) && combo.length === (e.ctrlKey ? 2 : 1);
      if(!isSafeEditOp) e.preventDefault();
      flashDetected(label, true);
      const searchInput = document.getElementById('search');
      if(searchInput.value){ searchInput.value = ''; applyFilter(); }
      try{ highlightCard(item); }catch(err){ /* scroll/animation is best-effort, never block the match feedback */ }
    } else {
      flashDetected(label, false);
    }
  });
}

/* ============================= INIT ============================= */
buildOsTabs();
buildSubTabs();
buildNav();
buildCategories();
setupSearch();
setupMobileNav();
setupKeyCapture();
setupLangSwitch();
applyLanguage();
setupScrollSpy();
const firstNav = document.querySelector('.nav-item[data-cat="0"]');
if(firstNav) firstNav.classList.add('active');
</script>
